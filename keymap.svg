<g font-family="sans-serif" font-size="12.5" fill="#2C2C2A">
<text x="34" y="372">聲母：b p m f d t n l g k h j q x r z c s 用本鍵；zh→V　ch→I　sh→U；ㄫ→A　ㄬ→N　ㄪ→V</text>
<text x="34" y="394">零聲母：拼式首字母佔聲母位　ㄨㄟ=WW　ㄨㄣ=WF　ㄧㄤ=YH　ㄩㄛ=YO　ㄩㄥ=YS　ㄡ=EU　ㄤ=AH　ㄦ=ER　ㄧ=YI　ㄨ=WU　ㄩ=YU</text>
<text x="34" y="416">空韻母：ㄓ=VI　ㄔ=II　ㄕ=UI　ㄖ=RI　ㄗ/ㄗㄧ=ZI　ㄘ/ㄘㄧ=CI　ㄙ/ㄙㄧ=SI　　成音節鼻音：ㄇ=MM　ㄋ=NN　ㄫ=NG　ㄏㄇ=HM　ㄏㄫ=HA</text>
<text x="34" y="438">聲調：<tspan font-weight="500">6</tspan> 陰　<tspan font-weight="500">7</tspan> 陽　<tspan font-weight="500">8</tspan> 上　<tspan font-weight="500">9</tspan> 去　<tspan font-weight="500">0</tspan> 入（第三鍵，可省；例 知=vi6 或 vi，汁=vi0）</text>
<text x="34" y="462" fill="#5F5E5A">例：我=ao　你=ni　好=hc　中=vs　學=xt　車=ip　微=vw　雷=lw　女=nv　略=lt　皆=jd　為=ww　翁=ws</text>
